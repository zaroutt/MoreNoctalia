[control_center]
sidebar = "none"
sidebar_section = "none"

[dock]
auto_hide = true
background_opacity = 0.99999997764825821
cross_axis_padding = 0
icon_size = 40
inactive_opacity = 0.99999997764825821
main_axis_padding = 7
margin_ends = 82
pinned = [ "zen", "spotify", "org.gnome.Nautilus", "kitty", "com.stremio.stremio", "io.github.nirimod" ]
shadow = false
show_dots = true

[keybinds]
validate = [ "Return", "KP_Enter", "space" ]

[location]
